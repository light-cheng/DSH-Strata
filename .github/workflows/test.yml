name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check

  # One check named `test` for the main branch ruleset, which cannot match
  # the matrix job names (`ubuntu-latest / node 22`, …). Fails unless every
  # matrix job succeeded; runs even when one of them failed or was cancelled.
  test-summary:
    name: test
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All platforms passed
        env:
          RESULT: ${{ needs.test.result }}
        run: |
          echo "matrix result: $RESULT"
          test "$RESULT" = success
